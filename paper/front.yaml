title: >-
  From a PDF inventory to a validated knowledge graph: a reproducible, standards-based
  pipeline for the sea anemones of shallow-water Venezuela
short_title: Sea anemones of Venezuela as a knowledge graph
running_head: "Ortiz. Sea anemones of Venezuela as a knowledge graph"
authors: "Carlos Ortiz<sup>1*</sup>"
affiliations: >-
  <p>* Correspondence: [e-mail to be completed]</p>
  <p><sup>1</sup>[Affiliation to be completed]</p>
keywords: >-
  Biodiversity informatics, Darwin Core, Knowledge graph, SHACL, Taxonomic name resolution,
  Data quality, Caribbean Sea, Actiniaria, Zoantharia

abstract:
  background: >-
    Regional species inventories are usually published as PDF tables. Their names, localities
    and evidence codes cannot be read by machines, and their taxonomy is fixed at the date of
    publication. We asked whether such an inventory can be made findable, interoperable and
    reusable without altering what its authors published. As a test case we used the
    inventory of shallow-water sea anemones of Venezuela (González-Muñoz et al. 2016).
  results: >-
    A reproducible Python pipeline extracted, from the published PDF alone, the
    {{ f.src.t1_taxa }} taxa and {{ f.src.t1_codes }} evidence codes of the distribution table,
    {{ f.src.t2 + f.src.t3 }} specimen records and {{ f.src.accounts }} species accounts. Every
    value is traceable to its page, table and row. The records were harmonised to a Darwin
    Core–aligned LinkML model, with no record lost. Names were resolved with recorded match
    type and provenance against WoRMS ({{ f.res.worms.accepted }}/{{ f.res.n_taxa }}), GBIF
    ({{ f.res.gbif.accepted }}/{{ f.res.n_taxa }}) and NCBI Taxonomy
    ({{ f.res.ncbi.accepted }}/{{ f.res.n_taxa }}), and habitats were aligned to
    {{ f.envo.terms }} ENVO classes. Fuzzy matches were never accepted without review by the
    author. {{ f.q.q03.valid | Words }} names that the article treats as valid now have a
    different accepted name. Checks across the article's own tables showed that its distribution matrix
    keeps museum records under identifications the same article revised or could not confirm,
    and that {{ (100 * f.src.t1_agudo / f.src.t1_codes) | round | int }}% of its distribution
    codes cite a single 1987 monograph. The resulting graph of
    {{ f.graph.triples | thousands }} triples conforms to {{ f.shacl.shapes }} SHACL shapes.
    Its {{ f.q.n_sparql }} SPARQL queries return identical results in two engines, and the
    whole process is reproducible byte for byte.
  conclusions: >-
    Community standards (Darwin Core, Darwin-SW, PROV-O, SKOS, SSSOM, SHACL), explicit curation
    and data-quality checks written as code are enough to turn a published inventory into
    auditable, machine-actionable data. The original record is kept intact, and the inventory's
    taxonomic differences from current names and its internal inconsistencies become explicit.
    The approach transfers to other legacy inventories.
