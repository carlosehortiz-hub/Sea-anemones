# Term registry: every class and property the knowledge graph may use.
#
# - The graph builder (step 6) may only emit terms listed here; a test enforces it.
# - Every external term is verified against a cached copy of its defining vocabulary
#   (data/cache/vocab/) or, for W3C/DCMI vocabularies, rdflib's closed namespaces
#   generated from the specifications. A typo or a term that does not exist fails CI.
# - `ak:` terms exist only where no reused vocabulary has a term; each is defined
#   with a comment in ontology/ak.ttl.

prefixes:
  ak: https://w3id.org/anemone-kg/
  akv: https://w3id.org/anemone-kg/vocab/
  dwc: http://rs.tdwg.org/dwc/terms/
  dwciri: http://rs.tdwg.org/dwc/iri/
  dsw: http://purl.org/dsw/
  dcterms: http://purl.org/dc/terms/
  prov: http://www.w3.org/ns/prov#
  skos: http://www.w3.org/2004/02/skos/core#
  dcat: http://www.w3.org/ns/dcat#
  owl: http://www.w3.org/2002/07/owl#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  xsd: http://www.w3.org/2001/XMLSchema#
  sssom: https://w3id.org/sssom/
  semapv: https://w3id.org/semapv/vocab/
  ENVO: http://purl.obolibrary.org/obo/ENVO_
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_
  gbif: https://www.gbif.org/species/
  worms: "urn:lsid:marinespecies.org:taxname:"

terms:
  # ---------------------------------------------------------------- classes
  - {term: dwc:Occurrence, kind: class, use: "Specimens (Tables 2-3) and Table 1 assertions"}
  - {term: dwc:Organism, kind: class, use: "The organism a specimen comes from; the thing an Identification identifies (Darwin-SW pattern)"}
  - {term: dwc:Identification, kind: class, use: "Current and superseded identifications"}
  - {term: dwc:Event, kind: class, use: "Collecting event: carries eventDate and the location"}
  - {term: dwc:Taxon, kind: class, use: "Name usages in the paper and WoRMS name records"}
  - {term: dcterms:Location, kind: class, use: "Areas (Table 1 columns), regions and collecting sites"}
  - {term: dcterms:BibliographicResource, kind: class, use: "The source paper and the works cited in Table 1"}
  - {term: dcat:Dataset, kind: class, use: "The knowledge graph as a dataset"}
  - {term: prov:Entity, kind: class, use: "Source paper, raw PDF, cached API responses"}
  - {term: prov:Activity, kind: class, use: "Pipeline stages"}
  - {term: prov:SoftwareAgent, kind: class, use: "The pipeline and the external services"}
  - {term: prov:Derivation, kind: class, use: "Qualified derivation from the paper, with a locator"}
  - {term: owl:Axiom, kind: class, use: "SSSOM mapping record (SSSOM's RDF serialisation)"}
  - {term: skos:Concept, kind: class, use: "Evidence kinds of Table 1 codes"}
  - {term: skos:ConceptScheme, kind: class, use: "Scheme for the evidence kinds"}
  - {term: akv:HabitatStatement, kind: class, use: "Habitat paragraph of a species account"}

  # ------------------------------------------------- Darwin Core (literals)
  - {term: dwc:occurrenceID, kind: property, use: "Stable occurrence identifier (UUIDv5)"}
  - {term: dwc:basisOfRecord, kind: property, use: "PreservedSpecimen | MaterialCitation ('a' codes) | Occurrence (other Table 1 codes)"}
  - {term: dwc:catalogNumber, kind: property, use: "MOHBR catalogue number"}
  - {term: dwc:otherCatalogNumbers, kind: property, use: "Field code (RG-/VE-)"}
  - {term: dwc:institutionCode, kind: property, use: "MOHBR"}
  - {term: dwc:associatedOccurrences, kind: property, use: "Table 1 assertion -> '(cited specimen) MOHBR:I-...' for each specimen it rests on"}
  - {term: dwc:occurrenceRemarks, kind: property, use: "Remarks kept from canonicalisation"}
  - {term: dwc:occurrenceStatus, kind: property, use: "'present' on Table 1 assertions"}
  - {term: dwc:associatedReferences, kind: property, use: "Short citation of the work behind a Table 1 code"}
  - {term: dwc:eventDate, kind: property, use: "ISO 8601 date or year-month"}
  - {term: dwc:verbatimEventDate, kind: property, use: "Date as printed"}
  - {term: dwc:locationID, kind: property, use: "Stable location identifier"}
  - {term: dwc:locality, kind: property, use: "Locality name"}
  - {term: dwc:verbatimLocality, kind: property, use: "Locality as printed"}
  - {term: dwc:stateProvince, kind: property, use: "Venezuelan state"}
  - {term: dwc:countryCode, kind: property, use: "VE"}
  - {term: dwc:decimalLatitude, kind: property, use: "Only where Table 2 prints coordinates"}
  - {term: dwc:decimalLongitude, kind: property, use: "Only where Table 2 prints coordinates"}
  - {term: dwc:verbatimCoordinates, kind: property, use: "Coordinates as printed"}
  - {term: dwc:geodeticDatum, kind: property, use: "'not recorded' - the source states no datum"}
  - {term: dwc:coordinatePrecision, kind: property, use: "Precision of the printed coordinates (0.01 arc-second)"}
  - {term: dwc:taxonID, kind: property, use: "Stable taxon identifier (UUIDv5)"}
  - {term: dwc:scientificName, kind: property, use: "Name as used in the paper / WoRMS name"}
  - {term: dwc:scientificNameAuthorship, kind: property, use: "Authority"}
  - {term: dwc:scientificNameID, kind: property, use: "WoRMS LSID as a literal identifier, as DwC recommends"}
  - {term: dwc:taxonRank, kind: property, use: "species | genus | family"}
  - {term: dwc:genus, kind: property, use: "Genus"}
  - {term: dwc:specificEpithet, kind: property, use: "Epithet"}
  - {term: dwc:family, kind: property, use: "Family as printed in the paper"}
  - {term: dwc:order, kind: property, use: "Order as printed in the paper"}
  - {term: dwc:taxonomicStatus, kind: property, use: "GBIF TaxonomicStatus value mapped from WoRMS (accepted | synonym)"}
  - {term: dwc:nomenclaturalStatus, kind: property, use: "nomen nudum (WoRMS)"}
  - {term: dwc:taxonRemarks, kind: property, use: "Dagger in Table 1; WoRMS status where it is not a TaxonomicStatus value"}
  - {term: dwc:nameAccordingTo, kind: property, use: "Whose taxonomic opinion a status reflects"}
  - {term: dwc:acceptedNameUsageID, kind: property, use: "LSID of the accepted name (literal)"}
  - {term: dwc:acceptedNameUsage, kind: property, use: "Accepted name (literal)"}
  - {term: dwc:verbatimIdentification, kind: property, use: "Identification as printed"}
  - {term: dwc:identificationQualifier, kind: property, use: "cf. | sp. | sp.?"}
  - {term: dwc:identificationRemarks, kind: property, use: "Coded reason for a changed identification"}
  - {term: dwc:identificationVerificationStatus, kind: property, use: "e.g. 'unverified: could not be corroborated'"}
  - {term: dwc:previousIdentifications, kind: property, use: "Table 3 previous identification on the occurrence"}
  - {term: dwc:recordedBy, kind: property, use: "Collectors as printed, '|'-separated"}
  - {term: dwc:habitat, kind: property, use: "Habitat paragraph text"}

  # -------------------------------------------------- Darwin Core (IRIs)
  - {term: dwciri:toTaxon, kind: property, use: "Identification -> Taxon; Occurrence -> Taxon of its current identification (shortcut)"}
  - {term: dwciri:habitat, kind: property, use: "Habitat statement -> ENVO habitat or zone"}
  - {term: dwciri:substrate, kind: property, use: "Habitat statement -> ENVO substrate (rock, sand, mud)"}

  # ------------------------------------------------------------ Darwin-SW
  - {term: dsw:atEvent, kind: property, use: "Occurrence -> Event (domain Occurrence, range Event)"}
  - {term: dsw:locatedAt, kind: property, use: "Event -> Location (range dcterms:Location)"}
  - {term: dsw:occurrenceOf, kind: property, use: "Occurrence -> Organism"}
  - {term: dsw:identifies, kind: property, use: "Identification -> Organism"}

  # ------------------------------------------------------------- DC terms
  - {term: dcterms:isPartOf, kind: property, use: "Site within area; area within coastal region"}
  - {term: dcterms:references, kind: property, use: "Table 1 assertion -> cited work"}
  - {term: dcterms:type, kind: property, use: "Table 1 assertion -> evidence kind concept"}
  - {term: dcterms:subject, kind: property, use: "Habitat statement -> the taxon it describes"}
  - {term: dcterms:bibliographicCitation, kind: property, use: "Full citation of the paper; short citations of cited works"}
  - {term: dcterms:identifier, kind: property, use: "DOI; sha256 of the raw PDF"}
  - {term: dcterms:license, kind: property, use: "Licence of paper and dataset"}
  - {term: dcterms:title, kind: property, use: "Titles"}
  - {term: dcterms:source, kind: property, use: "Cached response -> request URL"}
  - {term: dcterms:created, kind: property, use: "SSSOM mapping_date (SSSOM's slot_uri)"}

  # ----------------------------------------------------------------- PROV
  - {term: prov:wasDerivedFrom, kind: property, use: "Every record -> the paper; mapping -> cached response"}
  - {term: prov:qualifiedDerivation, kind: property, use: "Record -> Derivation carrying the locator"}
  - {term: prov:entity, kind: property, use: "Derivation -> the paper"}
  - {term: prov:hadActivity, kind: property, use: "Derivation -> pipeline stage"}
  - {term: prov:hadPrimarySource, kind: property, use: "Dataset -> the paper"}
  - {term: prov:wasGeneratedBy, kind: property, use: "Mapping / annotation / dataset -> activity"}
  - {term: prov:wasAssociatedWith, kind: property, use: "Activity -> software agent"}
  - {term: prov:used, kind: property, use: "Activity -> raw PDF or external service"}
  - {term: prov:generatedAtTime, kind: property, use: "Retrieval time of a cached response"}
  - {term: prov:wasRevisionOf, kind: property, use: "Current identification -> the superseded one"}

  # ------------------------------------------------------- SKOS and SSSOM
  - {term: skos:exactMatch, kind: property, use: "Taxon -> external record with the identical name"}
  - {term: skos:closeMatch, kind: property, use: "Taxon -> NCBI node via the accepted name; curated spelling/gender variants; unidentifiable homonyms"}
  - {term: skos:prefLabel, kind: property, use: "Labels of concepts"}
  - {term: skos:definition, kind: property, use: "Definitions of concepts"}
  - {term: skos:inScheme, kind: property, use: "Concept -> scheme"}
  - {term: owl:annotatedSource, kind: property, use: "SSSOM subject_id"}
  - {term: owl:annotatedProperty, kind: property, use: "SSSOM predicate_id"}
  - {term: owl:annotatedTarget, kind: property, use: "SSSOM object_id"}
  - {term: sssom:mapping_justification, kind: property, use: "semapv:LexicalMatching | semapv:ManualMappingCuration | semapv:MappingChaining"}
  - {term: sssom:similarity_score, kind: property, use: "Fuzzy-match score; orders candidates only"}
  - {term: sssom:similarity_measure, kind: property, use: "What the similarity score measures"}
  - {term: sssom:mapping_tool, kind: property, use: "Pipeline client that made the mapping"}
  - {term: sssom:mapping_tool_version, kind: property, use: "Pipeline version"}
  - {term: semapv:LexicalMatching, kind: individual, use: "Justification value"}
  - {term: semapv:MappingChaining, kind: individual, use: "Justification of the NCBI fallback (name -> WoRMS accepted name -> NCBI)"}
  - {term: semapv:ManualMappingCuration, kind: individual, use: "Justification value"}

  # ---------------------------------------------------------------- misc
  - {term: rdfs:label, kind: property, use: "Human-readable labels"}
  - {term: rdfs:comment, kind: property, use: "Comments; SSSOM comment (method, then evidence)"}
  - {term: rdfs:seeAlso, kind: property, use: "WoRMS record -> web page"}

  # ------------------------------------------------ project terms (ak.ttl)
  - {term: akv:sourceLocator, kind: property, use: "Derivation -> 'Table 2, row 25' etc."}
  - {term: akv:sourcePage, kind: property, use: "Derivation -> page number"}
  - {term: akv:isNewCountryRecord, kind: property, use: "Table 1 code N"}
  - {term: akv:hasDoubtfulPreviousRecords, kind: property, use: "Table 1 '?' after a name"}
  - {term: akv:hasAcceptedName, kind: property, use: "IRI-valued counterpart of dwc:acceptedNameUsageID"}
  - {term: akv:sampledInStudy, kind: property, use: "Bold column header in Table 1"}
  - {term: akv:evidenceKinds, kind: individual, use: "Concept scheme"}
  - {term: akv:ThisSurvey, kind: individual, use: "Table 1 code '*'"}
  - {term: akv:MohbrCollection, kind: individual, use: "Table 1 code 'a'"}
  - {term: akv:Literature, kind: individual, use: "Table 1 codes 'b'-'j'"}
  - {term: akv:evidenceTier, kind: property, use: "Table 1 assertion -> evidence tier (derived)"}
  - {term: akv:citesSpecimen, kind: property, use: "Table 1 assertion -> the specimen occurrence it rests on (IRI)"}
  - {term: akv:evidenceTiers, kind: individual, use: "Concept scheme"}
  - {term: akv:SurveyVouchered, kind: individual, use: "Evidence tier: survey record, vouchered"}
  - {term: akv:SurveyVoucheredQualified, kind: individual, use: "Evidence tier: survey record, voucher identified with qualifier"}
  - {term: akv:SurveyUnvouchered, kind: individual, use: "Evidence tier: survey record, no voucher"}
  - {term: akv:MuseumConfirmed, kind: individual, use: "Evidence tier: museum record, identification confirmed"}
  - {term: akv:MuseumReidentified, kind: individual, use: "Evidence tier: museum record, specimen re-identified"}
  - {term: akv:MuseumUnconfirmed, kind: individual, use: "Evidence tier: museum record, specimen not identified"}
  - {term: akv:MuseumUntraced, kind: individual, use: "Evidence tier: museum record, not traced"}
  - {term: akv:LiteratureRecord, kind: individual, use: "codes 'b'-'j'"}
