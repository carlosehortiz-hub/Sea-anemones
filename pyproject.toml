[project]
name = "anemone-kg"
version = "0.1.0"
description = "Harmonized dataset and RDF knowledge graph of Venezuelan sea anemones, built from González-Muñoz et al. (2016)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "pandera>=0.20",
    "pdfplumber>=0.11",
    "pyyaml>=6.0",
    "requests>=2.32",
    "rdflib>=7.0",
    "pyshacl>=0.26",
    "linkml-runtime>=1.8",
    "duckdb>=1.1",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "responses>=0.25",
    "pytest-cov>=7.1.0",
    "pyoxigraph==0.5.13",
    "matplotlib>=3.11.2",
    "jinja2>=3.1.6",
    "markdown>=3.11.3",
]

[project.scripts]
anemone-kg = "anemone_kg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anemone_kg"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The source PDF uses typographic primes and dashes in coordinates and ranges;
# matching them verbatim is intended.
allowed-confusables = ["’", "”", "–"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: runs the whole pipeline end to end (about 30 s)"]
filterwarnings = ["ignore:ConjunctiveGraph is deprecated:DeprecationWarning"]

[tool.coverage.run]
source = ["anemone_kg"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
