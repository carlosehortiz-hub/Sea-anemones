[project]
name = "anemone-kg"
version = "0.1.0"
description = "Harmonized dataset and RDF knowledge graph of Venezuelan sea anemones, built from González-Muñoz et al. (2016)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "pandera>=0.20",
    "pdfplumber>=0.11",
    "pyyaml>=6.0",
    "requests>=2.32",
    "rdflib>=7.0",
    "pyshacl>=0.26",
    "linkml-runtime>=1.8",
    "duckdb>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "responses>=0.25",
]

[project.scripts]
anemone-kg = "anemone_kg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anemone_kg"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
