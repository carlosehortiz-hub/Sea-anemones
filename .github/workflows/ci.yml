name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Identifier resolution is served from the committed cache (data/cache/):
  # CI never calls WoRMS, GBIF, NCBI or OLS, so every run is reproducible.
  ANEMONE_KG_OFFLINE: "1"
  UV_PYTHON: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Poppler (second, independent reading of the PDF tables)
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - run: uv sync --locked
      - name: pytest (unit, data, graph, SHACL, queries, end-to-end) with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  pipeline:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Poppler (second, independent reading of the PDF tables)
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - run: uv sync --locked
      # One step per stage, so a failure names the stage that broke.
      - name: 1 extract (PDF -> verbatim tables)
        run: uv run python -m anemone_kg run extract
      - name: 2 canonicalize (LinkML / Darwin Core tables)
        run: uv run python -m anemone_kg run canonicalize
      - name: 3 resolve (WoRMS, GBIF, NCBI, ENVO - from cache)
        run: uv run python -m anemone_kg run resolve
      - name: 4 validate (Pandera + cross-table rules; fails on critical)
        run: uv run python -m anemone_kg run validate
      - name: 5 build (RDF -> Turtle, JSON-LD)
        run: uv run python -m anemone_kg run build
      - name: 6 shacl (pySHACL; fails on violations)
        run: uv run python -m anemone_kg run shacl
      - name: 7 query (SPARQL + DuckDB SQL)
        run: uv run python -m anemone_kg run query
      - name: Committed outputs are up to date with the code
        run: git diff --exit-code -- data/ reports/ queries/results/
      - name: Summary
        if: always()
        run: |
          {
            echo "## Data quality"; sed -n '1,12p' reports/data_quality.md
            echo; echo "## SHACL"; sed -n '1,12p' reports/shacl_report.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-graph
          path: |
            reports/
            data/processed/anemone_kg.ttl
            data/processed/anemone_kg.jsonld

  docker-endpoint:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build the pipeline image
        run: docker build -t anemone-kg .
      - name: Run the whole pipeline inside the image
        run: docker run --name akrun anemone-kg
      - name: Container outputs are identical to the committed ones
        run: |
          for d in data/interim data/processed reports queries/results; do
            rm -rf "$d" && docker cp "akrun:/app/$d" "$d"
          done
          git diff --exit-code -- data/ reports/ queries/results/
      - name: Start Oxigraph (official image, same version as pyoxigraph)
        run: |
          docker network create aknet
          docker run -d --name oxigraph --network aknet oxigraph/oxigraph:0.5.13 \
            serve --location /data --bind 0.0.0.0:7878
          for i in $(seq 1 30); do
            docker run --rm --network aknet curlimages/curl:8.11.1 -sf http://oxigraph:7878/ >/dev/null && break
            sleep 1
          done
      - name: Load the graph through the Graph Store Protocol
        run: docker run --rm --network aknet anemone-kg endpoint load --url http://oxigraph:7878
      - name: Every SPARQL query gives the same rows on Oxigraph as on rdflib
        run: docker run --rm --network aknet anemone-kg endpoint check --url http://oxigraph:7878
