id: https://w3id.org/anemone-kg/schema
name: anemone_kg
title: Canonical model for the Venezuelan sea anemone inventory
description: >-
  Canonical tables produced from González-Muñoz et al. (2016). One table per
  observational unit (tidy data). Slots are aligned with Darwin Core through
  slot_uri wherever a Darwin Core term exists; the few project-specific slots
  carry the `ak:` prefix and say why no standard term fits.
  This schema is the single source of truth for the Pandera data-quality
  checks (step 4) and documents the column contract of every canonical CSV.
license: CC0-1.0
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  dwc: http://rs.tdwg.org/dwc/terms/
  dcterms: http://purl.org/dc/terms/
  ak: https://w3id.org/anemone-kg/
default_prefix: ak
default_range: string
imports:
  - linkml:types

# --------------------------------------------------------------------- enums
enums:
  TaxonRankEnum:
    permissible_values:
      order: {}
      family: {}
      genus: {}
      species: {}
  BasisOfRecordEnum:
    description: Darwin Core basisOfRecord controlled values used here.
    permissible_values:
      PreservedSpecimen: {meaning: dwc:PreservedSpecimen}
      MaterialCitation: {meaning: dwc:MaterialCitation}
  RecordSourceEnum:
    permissible_values:
      table2: {description: "Appendix 1: specimens collected in this study"}
      table3: {description: "Appendix 2: MOHBR collection specimens examined"}
  EvidenceKindEnum:
    description: What a Table 1 code asserts.
    permissible_values:
      this_survey: {description: "code '*': documented in the authors' surveys"}
      mohbr_collection: {description: "code 'a': specimen in the MOHBR collection"}
      literature: {description: "codes 'b'-'j': previously published record"}
  LocalityLevelEnum:
    permissible_values:
      area: {description: "A Table 1 column (park, island, bay, beach)"}
      site: {description: A collecting site from Table 2 or Table 3}
  IdentificationQualifierEnum:
    permissible_values:
      "cf.": {}
      "sp.": {}
      "sp.?": {}
  NameRoleEnum:
    permissible_values:
      table1: {}
      table2: {}
      table3_current: {}
      table3_previous: {}
      species_account: {}

# --------------------------------------------------------------------- slots
slots:
  # shared
  source_ref:
    description: Human-readable locator in the source paper (table, row, column or section).
    slot_uri: dcterms:source
    required: true
  source_page:
    range: integer
    required: true
    minimum_value: 1
    maximum_value: 35

  # SourceDocument
  doi:
    identifier: true
    pattern: "^10\\.\\d{4,9}/\\S+$"
  bibliographic_citation: {slot_uri: dcterms:bibliographicCitation, required: true}
  license: {slot_uri: dcterms:license, required: true}
  sha256: {pattern: "^[0-9a-f]{64}$", required: true}

  # Reference
  reference_code: {identifier: true, pattern: "^[a-j]$"}
  short_citation: {required: true}
  evidence_kind: {range: EvidenceKindEnum, required: true}

  # Taxon
  taxon_id:
    identifier: true
    slot_uri: dwc:taxonID
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-5[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
  scientific_name: {slot_uri: dwc:scientificName, required: true}
  scientific_name_authorship: {slot_uri: dwc:scientificNameAuthorship}
  taxon_rank: {slot_uri: dwc:taxonRank, range: TaxonRankEnum, required: true}
  genus: {slot_uri: dwc:genus}
  specific_epithet: {slot_uri: dwc:specificEpithet}
  family: {slot_uri: dwc:family}
  family_authorship:
    description: Authority printed with the family heading; DwC has no term for it.
  order: {slot_uri: dwc:order}
  name_roles:
    description: Where the name is used in the paper ('|'-separated NameRoleEnum values).
    required: true
  table1_row: {range: integer, minimum_value: 1, maximum_value: 52}
  flag_invalid_in_source:
    description: "Table 1 dagger: species currently considered invalid by the authors."
    range: boolean
    required: true
  flag_doubtful_in_source:
    description: "Table 1 '?': doubtful previous records."
    range: boolean
    required: true

  # TaxonNameVariant
  verbatim_name: {slot_uri: dwc:verbatimIdentification, required: true}
  variant_rule: {required: true, description: Rule id from the source-to-canonical mapping.}

  # Locality
  locality_id:
    identifier: true
    slot_uri: dwc:locationID
  locality_name: {slot_uri: dwc:locality, required: true}
  verbatim_locality: {slot_uri: dwc:verbatimLocality, required: true}
  locality_level: {range: LocalityLevelEnum, required: true}
  parent_locality_id:
    description: The Table 1 area a site lies in, from the curated crosswalk only.
    range: Locality
  region: {description: "Table 1 coastal region (West/Central/East Coast, Oceanic Islands)."}
  state_province: {slot_uri: dwc:stateProvince}
  country_code: {slot_uri: dwc:countryCode, required: true, pattern: "^[A-Z]{2}$"}
  decimal_latitude:
    slot_uri: dwc:decimalLatitude
    range: decimal
    minimum_value: -90
    maximum_value: 90
  decimal_longitude:
    slot_uri: dwc:decimalLongitude
    range: decimal
    minimum_value: -180
    maximum_value: 180
  verbatim_coordinates: {slot_uri: dwc:verbatimCoordinates}
  sampled_in_study:
    description: Bold in Table 1 - one of the six localities sampled by the authors.
    range: boolean

  # Occurrence
  occurrence_id:
    identifier: true
    slot_uri: dwc:occurrenceID
  basis_of_record: {slot_uri: dwc:basisOfRecord, range: BasisOfRecordEnum, required: true}
  record_source: {range: RecordSourceEnum, required: true}
  institution_code: {slot_uri: dwc:institutionCode}
  catalog_number:
    slot_uri: dwc:catalogNumber
    pattern: "^I-\\d+$"
  other_catalog_numbers: {slot_uri: dwc:otherCatalogNumbers, pattern: "^(RG|VE)-\\d{3}$"}
  event_date:
    slot_uri: dwc:eventDate
    description: ISO 8601, possibly reduced precision (YYYY-MM).
    pattern: "^\\d{4}(-\\d{2}(-\\d{2})?)?$"
  verbatim_event_date: {slot_uri: dwc:verbatimEventDate}
  recorded_by: {slot_uri: dwc:recordedBy, description: "'|'-separated, per DwC."}
  occurrence_remarks: {slot_uri: dwc:occurrenceRemarks}

  # Identification
  identification_id: {identifier: true, slot_uri: dwc:identificationID}
  identification_qualifier:
    slot_uri: dwc:identificationQualifier
    range: IdentificationQualifierEnum
  is_current:
    description: True for the identification the paper accepts; false for superseded ones.
    range: boolean
    required: true
  identification_remarks: {slot_uri: dwc:identificationRemarks}

  # Distribution
  distribution_id: {identifier: true}
  is_new_record:
    description: "Table 1 code 'N': new record for Venezuela. DwC has no equivalent term."
    range: boolean
    required: true

  # Habitat
  habitat_statement_id: {identifier: true}
  habitat_text: {slot_uri: dwc:habitat, required: true}

# ------------------------------------------------------------------- classes
classes:
  SourceDocument:
    class_uri: dcterms:BibliographicResource
    slots: [doi, bibliographic_citation, license, sha256]

  Reference:
    description: A source cited by a Table 1 code (a-j).
    slots: [reference_code, short_citation, evidence_kind, source_ref, source_page]

  Taxon:
    description: >-
      A name as used in the paper (a name usage), not a taxon concept from an
      external authority. External identifiers are attached in step 3.
    class_uri: dwc:Taxon
    slots:
      - taxon_id
      - scientific_name
      - scientific_name_authorship
      - taxon_rank
      - genus
      - specific_epithet
      - family
      - family_authorship
      - order
      - name_roles
      - table1_row
      - flag_invalid_in_source
      - flag_doubtful_in_source
      - source_ref
      - source_page

  TaxonNameVariant:
    description: Every verbatim spelling found in the paper and the taxon it maps to.
    slots: [verbatim_name, taxon_id, identification_qualifier, variant_rule, source_ref]
    slot_usage:
      taxon_id: {identifier: false, required: true, range: Taxon}

  Locality:
    class_uri: dcterms:Location
    slots:
      - locality_id
      - locality_name
      - verbatim_locality
      - locality_level
      - parent_locality_id
      - region
      - state_province
      - country_code
      - decimal_latitude
      - decimal_longitude
      - verbatim_coordinates
      - sampled_in_study
      - source_ref
      - source_page

  Occurrence:
    description: A specimen from Table 2 or Table 3.
    class_uri: dwc:Occurrence
    slots:
      - occurrence_id
      - basis_of_record
      - record_source
      - institution_code
      - catalog_number
      - other_catalog_numbers
      - locality_id
      - event_date
      - verbatim_event_date
      - recorded_by
      - occurrence_remarks
      - source_ref
      - source_page
    slot_usage:
      locality_id:
        identifier: false
        required: false
        range: Locality
        description: Null when the source prints '-' (two Table 3 specimens).

  Identification:
    class_uri: dwc:Identification
    slots:
      - identification_id
      - occurrence_id
      - taxon_id
      - verbatim_name
      - identification_qualifier
      - is_current
      - identification_remarks
      - source_ref
    slot_usage:
      occurrence_id: {identifier: false, required: true, range: Occurrence}
      taxon_id:
        identifier: false
        required: false
        range: Taxon
        description: Null when the paper gives no identification ("not identified", "Actinia 1").

  Distribution:
    description: >-
      One Table 1 assertion - taxon present in an area according to one source.
      Rendered as a dwc:Occurrence with basisOfRecord MaterialCitation in RDF.
    slots:
      - distribution_id
      - taxon_id
      - locality_id
      - evidence_kind
      - reference_code
      - basis_of_record
      - is_new_record
      - occurrence_remarks
      - source_ref
      - source_page
    slot_usage:
      taxon_id: {identifier: false, required: true, range: Taxon}
      locality_id:
        identifier: false
        required: false
        range: Locality
        description: Null for the 'Open Sea Distribution' column, which is not a place.
      reference_code: {identifier: false, required: false, range: Reference}

  HabitatStatement:
    description: The Habitat paragraph of a species account. Habitat is per species here.
    slots: [habitat_statement_id, taxon_id, habitat_text, source_ref, source_page]
    slot_usage:
      taxon_id: {identifier: false, required: true, range: Taxon}
